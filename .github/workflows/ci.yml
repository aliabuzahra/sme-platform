# UC-002: build and test every pull request and every push to main.
# Acceptance: a PR with a failing test cannot be merged (requires the owner
# to make this job a required status check — see docs/branch-protection-for-owner.md);
# this job is capped at 8 minutes so the run stays under 10.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Sme.Platform.slnx

      - name: Build
        run: dotnet build Sme.Platform.slnx --no-restore --configuration Release --verbosity minimal

      # UC-006: Identity tests run against the Compose Postgres (row-level security needs a real database).
      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Test
        run: >-
          dotnet test Sme.Platform.slnx
          --no-build
          --configuration Release
          --verbosity minimal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ runner.temp }}/TestResults"

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Stop Postgres
        if: always()
        run: docker compose down -v
